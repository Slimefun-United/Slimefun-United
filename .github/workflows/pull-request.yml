name: Pull Request

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/**"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - "pom.xml"

permissions:
  contents: read

jobs:
  setup-preview-build:
    name: Preview build
    runs-on: ubuntu-latest
    outputs:
      short-commit-hash: ${{ steps.env-setup.outputs.SHORT_COMMIT_HASH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4.6.0
        with:
          distribution: adopt
          java-version: 21
          java-package: jdk
          architecture: x64

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Setup for the preview build
        id: env-setup
        run: |
          SHORT_COMMIT_HASH=$(git rev-parse --short=8 ${{ github.sha }})
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> "$GITHUB_ENV"
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> "$GITHUB_OUTPUT"

      - name: Get Maven version and generate alpha version
        id: version
        # version.MAVEN - Version from Maven's versioned pom file
        run: |
          MAVEN="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          echo "MAVEN=$MAVEN" >> $GITHUB_OUTPUT

      - name: Compute jar filename
        id: jar
        run: echo "JAR_FILE=target/slimefun-united-${{ steps.version.outputs.MAVEN }}.jar" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn package

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: slimefun-united-pr-${{ github.event.number }}+${{ steps.env-setup.outputs.SHORT_COMMIT_HASH }}
          path: ${{ steps.jar.outputs.JAR_FILE }}

  call-workflows:
    needs: [setup-preview-build]
    uses: ./.github/workflows/e2e-testing.yml
    with:
      artifact-name: slimefun-united-pr-${{ github.event.number }}+${{ needs.setup-preview-build.outputs.short-commit-hash }}
