name: Build Slimefun United 26.1.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build jar
        run: ./mvnw -B clean package -DskipTests -Dspotless.apply.skip=true -Dspotless.check.skip=true -Dspotless.skip=true
        
      - name: Collect plugin jar
        run: |
          mkdir -p build-output
          find target -maxdepth 1 -type f -name "*.jar" \
            ! -name "*sources*" \
            ! -name "*javadoc*" \
            ! -name "original-*" \
            -exec cp {} build-output/ \;
          ls -la build-output

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slimefun-United-26.1.2
          path: build-output/*.jar
