name: Publish an alpha (dev) build

on:
  push:
    branches:
      - dev
    paths:
      - 'src/**'
      # These may be needed in the future, but not for now
      #- '.mvn/**'
      #- 'mvnw'
      #- 'mvnw.cmd'
      #- 'pom.xml'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository_owner == 'Slimefun-United' && !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write # required to push tags

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Get commit hash
        id: commit
        uses: prompt/actions-commit-hash@v3

      - name: Get Maven version and generate alpha version
        id: version
        # version.MAVEN - 4.X-alpha+a1b2c3d -> Version from Maven's versioned pom file
        # version.CLEAN - 4.X-alpha
        # version.RUN_NUMBER - 4.X-alpha-Y
        # version.FULL - 4.X-alpha-Y+a1b2c3d
        # where "Y" is a GitHub run number and "a1b2c3d" is a short commit hash
        run: |
          MAVEN="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          echo "MAVEN=$MAVEN" >> $GITHUB_OUTPUT
          
          CLEAN="${MAVEN%%+*}"
          echo "CLEAN=$CLEAN" >> $GITHUB_OUTPUT
          
          RUN_NUMBER="$CLEAN-${{ github.run_number }}"
          echo "RUN_NUMBER=$RUN_NUMBER" >> $GITHUB_OUTPUT
          
          echo "FULL=$RUN_NUMBER+${{ steps.commit.outputs.short }}" >> $GITHUB_OUTPUT

      - name: Create a Git tag
        run: |
          TAG="${{ steps.version.outputs.FULL }}"
          echo "Tagging with $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Compute jar filename
        id: jar
        run: echo "JAR_FILE=target/slimefun-united-${{ steps.version.outputs.MAVEN }}.jar" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: adopt
          java-package: jdk
          architecture: x64
          cache: maven

      - name: Build and package with Maven
        run: mvn clean package

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: EOlkO9GO
          name: "Slimefun United ${{ steps.version.outputs.FULL }}"
          version: ${{ steps.version.outputs.FULL }}
          changelog: "${{ github.event.head_commit.message }}"
          channel: alpha
          loaders: |-
            paper
            purpur
          game-versions: |-
            1.19.x
            1.20.x
            1.21.x
            26.1.1
            26.1.2
          files: ${{ steps.jar.outputs.JAR_FILE }}
